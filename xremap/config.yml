keypress_delay_ms: 10

# `modmap` section
# For key-to-key remapping (no combinations). Remapping a key to a modifier key (e.g. CapsLock to Control_L) is supported only in `modmap` section
modmap:
  - name: Mouse keys for RuneLite
    application:
      # Which class AWT reports depends on how the client was started: launched
      # from a launcher JVM it reports the launcher's class, started directly it
      # reports the client's. Match both, since either can happen.
      only: [net-runelite-client-RuneLite, net-runelite-launcher-Launcher]
    remap:
      BTN_SIDE: Esc
      BTN_EXTRA: Space
  - name: Make ⌘ act as Ctrl
    remap:
      LeftCtrl: LeftMeta
      LeftMeta: LeftCtrl
      RightCtrl: RightMeta
      RightMeta: RightCtrl
# `keymap` section
# For remapping a sequence of key combinations to another sequence of key combinations
keymap:
  - name: Make ⌘← and ⌘→ work as Home and End (with Shift for selection)
    # ddterm on GNOME, Yakuake on KDE; only one of the two exists per machine
    application:
      not: [com.github.amezin.ddterm, org.kde.yakuake]
    remap:
      Ctrl-Left: Home
      Ctrl-Right: End
      Shift-Ctrl-Left: Shift-Home
      Shift-Ctrl-Right: Shift-End
  - name: In the drop-down terminal, ⌥← and ⌥→ act as Home and End (with Shift for selection)
    application:
      only: [com.github.amezin.ddterm, org.kde.yakuake]
    remap:
      Alt-Left: Home
      Alt-Right: End
      Shift-Alt-Left: Shift-Home
      Shift-Alt-Right: Shift-End
  - name: Make ⌥← and ⌥→ jump by word (with Shift for selection)
    remap:
      Alt-Left: Ctrl-Left
      Alt-Right: Ctrl-Right
      Shift-Alt-Left: Shift-Ctrl-Left
      Shift-Alt-Right: Shift-Ctrl-Right
  - name: Delete word
    remap:
      Alt-Backspace: Ctrl-Backspace
